<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="M999 profile with a fresh, high-contrast design and a large access button for Gaming Arena." />
  <title>M999 Game | Gaming Arena</title>
  <style>
    :root {
      --bg:#091815; --panel:#102b29; --panel-2:#1a3d39; --line:rgba(118,233,201,.18); --text:#edfff8; --muted:#ceefe7; --brand:#69e7bb; --brand-2:#7de0ff; --accent:#ffd98a; --success:#9ef3d4; --shadow:0 28px 60px rgba(0,0,0,.24);
    }
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at left top, rgba(105,231,187,.15), transparent 22%),radial-gradient(circle at right top, rgba(125,224,255,.12), transparent 16%), var(--bg);color:var(--text);line-height:1.7}a{text-decoration:none;color:inherit}.container{width:min(1120px,calc(100% - 34px));margin:0 auto}.site-header{position:sticky;top:0;z-index:20;background:rgba(9,24,21,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:22px}.brand{display:inline-flex;align-items:center;gap:11px;font-weight:900;letter-spacing:-.04em}.brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 10px 24px rgba(105,231,187,.2);color:#061812}.brand-mark svg{width:24px;height:24px}.nav-links{display:flex;align-items:center;gap:22px;color:var(--muted);font-size:.92rem;font-weight:700}.nav-cta,.primary-button,.secondary-button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:14px;font-weight:800;transition:transform .2s ease,filter .2s ease}.nav-cta,.primary-button{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#061812;border:1px solid rgba(255,255,255,.08)}.secondary-button{border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--text)}.primary-button:hover,.secondary-button:hover,.nav-cta:hover{transform:translateY(-1px);filter:brightness(1.05)}.hero{padding:42px 0 24px}.hero-card{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;padding:24px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(135deg, rgba(19,42,38,.96), rgba(12,23,28,.96));box-shadow:var(--shadow)}.eyebrow{display:inline-block;padding:8px 12px;border:1px solid rgba(105,231,187,.35);border-radius:999px;background:rgba(105,231,187,.08);color:var(--brand);font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.title-wrap h1{margin:14px 0 12px;font-size:clamp(2.5rem,5vw,4.5rem);line-height:.96;letter-spacing:-.06em}.lead{margin:0;max-width:560px;color:var(--muted);font-size:1.05rem}.button-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.art-panel{display:flex;align-items:center;justify-content:center;padding:18px;border-radius:22px;background:linear-gradient(135deg, rgba(105,231,187,.12), rgba(125,224,255,.07));border:1px solid rgba(255,255,255,.08)}.art-card{width:100%;max-width:430px;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 30px rgba(0,0,0,.24)}.grid{display:grid;grid-template-columns:1.4fr .6fr;gap:20px;margin-top:28px}.panel{padding:22px;border:1px solid var(--line);border-radius:22px;background:rgba(15,25,38,.9)}.panel h2,.panel h3{margin:0 0 12px;font-size:clamp(1.7rem,3vw,2.2rem);letter-spacing:-.04em}.panel p{margin:0;color:var(--muted)}.feature-list{display:grid;gap:12px;margin-top:18px}.feature{padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--muted)}.meta-list{list-style:none;padding:0;margin:0;display:grid;gap:12px}.meta-list li{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}.meta-label{display:block;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.1em}.meta-value{display:block;margin-top:3px;font-weight:800;font-size:1.02rem}.notice{margin-top:18px;padding:18px 20px;border:1px solid rgba(255,217,138,.28);border-radius:16px;background:rgba(255,217,138,.08);color:#f5e9c8}.notice strong{color:var(--accent)}.footer{padding:24px 0 34px;color:var(--muted);font-size:.88rem;text-align:center}.@media (max-width:820px){.hero-card,.grid{grid-template-columns:1fr}.nav-links{display:none}.button-row{flex-direction:column;align-items:flex-start}}
